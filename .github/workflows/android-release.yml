
name: Build GEYGO Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract GEYGO ZIP
        run: |
          unzip -q GEYGO_PROJECT_REPAIRED_V2.zip -d source
          test -f source/GEYGO_PROJECT_AndroidStudio_FIXED/settings.gradle.kts

      - name: Build Release APK
        working-directory: source/GEYGO_PROJECT_AndroidStudio_FIXED
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GEYGO-release-apk
          path: source/GEYGO_PROJECT_AndroidStudio_FIXED/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
